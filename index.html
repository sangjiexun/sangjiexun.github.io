<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历</title>
    <!-- TDesign 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tdesign@1.65.1/dist/tdesign.min.css">
    <!-- 字体图标 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tdesign-icons@0.4.2/dist/iconfont.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- D3.js 图表库 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Source Han Sans SC', 'Noto Sans SC', sans-serif;
            background-color: #f5f5f5;
        }
        
        .resume-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        
        .header {
            background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%);
            color: white;
            padding: 40px;
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.3);
        }
        
        .section {
            padding: 30px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #1890ff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        
        .section-title i {
            margin-right: 10px;
        }
        
        .timeline-item {
            position: relative;
            padding-left: 30px;
            margin-bottom: 25px;
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 6px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #1890ff;
        }
        
        .timeline-item::after {
            content: '';
            position: absolute;
            left: 13px;
            top: 14px;
            width: 2px;
            height: calc(100% + 10px);
            background-color: #e8e8e8;
        }
        
        .timeline-item:last-child::after {
            display: none;
        }
        
        .skill-bar {
            height: 8px;
            background-color: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .skill-progress {
            height: 100%;
            background-color: #1890ff;
            border-radius: 4px;
            transition: width 1s ease-in-out;
        }
        
        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            color: white;
            transition: transform 0.3s ease;
        }
        
        .social-icon:hover {
            transform: translateY(-3px);
        }
        
        .social-icon.github {
            background-color: #333;
        }
        
        .social-icon.linkedin {
            background-color: #0077b5;
        }
        
        .social-icon.email {
            background-color: #ea4335;
        }
        
        .social-icon.twitter {
            background-color: #1da1f2;
        }
        
        .social-icon.website {
            background-color: #0066cc;
        }
        
        .language-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        
        .language-btn {
            padding: 8px 16px;
            border-radius: 20px;
            background-color: white;
            color: #1890ff;
            border: 1px solid #1890ff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .language-btn.active {
            background-color: #1890ff;
            color: white;
        }
        
        .language-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(24, 144, 255, 0.3);
        }
        
        .content-zh, .content-en {
            transition: opacity 0.3s ease;
        }
        
        .content-en {
            display: none;
        }
        
        @media (max-width: 768px) {
            .resume-container {
                margin: 0;
                box-shadow: none;
            }
            
            .header {
                padding: 30px 20px;
            }
            
            .section {
                padding: 20px;
            }
            
            .language-switcher {
                top: 10px;
                right: 10px;
            }
            
            .language-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
